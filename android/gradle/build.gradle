plugins { id 'com.android.application' }
def repoDir = rootProject.projectDir.parentFile.parentFile
def borealisDir = new File(repoDir, 'extern/borealis')
ext.borealisAndroid = [ borealisDir: borealisDir, propertiesFile: new File(repoDir, 'build/android-arm64/borealis-android.properties'), namespace: 'dev.foxhollow.android', applicationId: 'dev.foxhollow.pocket', abis: ['arm64-v8a'], proguardRules: file('proguard-rules.pro') ]
apply from: new File(borealisDir, 'platforms/android/gradle/borealis-application.gradle')
dependencies { implementation fileTree(dir: 'libs', include: ['*.jar']) }
android { aaptOptions { noCompress 'db', 'zip', 'zip' } }
